name: Bootstrap cluster add-ons

# One-time (idempotent) installation of in-cluster controllers that
# CloudFormation cannot install:
#   1. External Secrets Operator (ESO)
#   2. AWS Gateway API Controller (VPC Lattice)
#
# Pulls the IRSA role ARNs from the root CFN stack outputs:
#   ExternalSecretsRoleArn          -> ESO ServiceAccount annotation
#   GatewayApiControllerRoleArn     -> Gateway API Controller SA annotation
#   LatticeServiceNetworkId         -> Default service network for the controller
#
# Safe to re-run: each chart is `helm upgrade --install`.

on:
    # Auto-run after the infra workflow succeeds. Resolves the target env
    # from the head branch of that run (same branch->env mapping as the
    # infra and cd workflows).
    workflow_run:
        workflows: [ "Deploy infrastructure" ]
        types: [ completed ]
        branches: [ main, master, test, develop ]
    workflow_dispatch:
        inputs:
            environment:
                description: Target environment
                required: true
                type: choice
                options: [ dev, test, prod ]
            eso_version:
                description: External Secrets Operator chart version
                required: false
                default: "0.10.4"
            gwapi_version:
                description: AWS Gateway API Controller chart version
                required: false
                default: "v1.0.7"

env:
    AWS_REGION: us-east-1
    PROJECT_NAME: transact
    RESOURCE_SUFFIX: "01"
    # Defaults are also referenced when triggered via workflow_run (no inputs).
    ESO_VERSION_DEFAULT: "0.10.4"
    GWAPI_VERSION_DEFAULT: "v1.0.7"

concurrency:
    group: bootstrap-${{ inputs.environment || github.event.workflow_run.head_branch
        }}
    cancel-in-progress: false

jobs:
    resolve:
        name: Resolve environment
        runs-on: ubuntu-latest
        # Skip when the upstream infra run failed or was cancelled.
        if: >-
            github.event_name == 'workflow_dispatch' ||
            github.event.workflow_run.conclusion == 'success'
        outputs:
            target-env: ${{ steps.env.outputs.env }}
        steps:
            - id: env
              env:
                  DISPATCH_ENV: ${{ inputs.environment }}
                  BRANCH: ${{ github.event.workflow_run.head_branch }}
              run: |
                  if [ -n "$DISPATCH_ENV" ]; then
                    echo "env=$DISPATCH_ENV" >> "$GITHUB_OUTPUT"
                  else
                    case "$BRANCH" in
                      develop)     echo "env=dev"  >> "$GITHUB_OUTPUT" ;;
                      test)        echo "env=test" >> "$GITHUB_OUTPUT" ;;
                      main|master) echo "env=prod" >> "$GITHUB_OUTPUT" ;;
                      *) echo "::error::Branch $BRANCH is not mapped to an environment." ; exit 1 ;;
                    esac
                  fi

    bootstrap:
        name: Bootstrap · ${{ needs.resolve.outputs.target-env }}
        needs: resolve
        runs-on: ubuntu-latest
        environment:
            name: ${{ needs.resolve.outputs.target-env }}
        permissions:
            contents: read
            id-token: write # OIDC -> AWS
        env:
            TARGET_ENV: ${{ needs.resolve.outputs.target-env }}
            STACK_NAME: transact-${{ needs.resolve.outputs.target-env }}-us-east-1-core-01
        steps:
            - name: Validate required configuration
              run: |
                  if [ -z "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
                    echo "::error::Secret AWS_ROLE_TO_ASSUME is not set." ; exit 1
                  fi

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Resolve CFN outputs
              id: cfn
              run: |
                  set -euo pipefail
                  out() {
                    aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
                      --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
                  }
                  CLUSTER=$(out EksClusterName)
                  ESO_ROLE=$(out ExternalSecretsRoleArn)
                  GWAPI_ROLE=$(out GatewayApiControllerRoleArn)
                  LATTICE_NET=$(out LatticeServiceNetworkId)
                  VPC_ID=$(out VpcId)
                  AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

                  for v in CLUSTER ESO_ROLE GWAPI_ROLE LATTICE_NET VPC_ID AWS_ACCOUNT_ID; do
                    if [ -z "${!v}" ] || [ "${!v}" = "None" ]; then
                      echo "::error::CFN output for $v not found on stack $STACK_NAME"; exit 1
                    fi
                  done

                  echo "cluster=$CLUSTER"               >> "$GITHUB_OUTPUT"
                  echo "eso-role=$ESO_ROLE"             >> "$GITHUB_OUTPUT"
                  echo "gwapi-role=$GWAPI_ROLE"         >> "$GITHUB_OUTPUT"
                  echo "lattice-net=$LATTICE_NET"       >> "$GITHUB_OUTPUT"
                  echo "vpc-id=$VPC_ID"                 >> "$GITHUB_OUTPUT"
                  echo "account-id=$AWS_ACCOUNT_ID"     >> "$GITHUB_OUTPUT"

            - name: Install kubectl
              uses: azure/setup-kubectl@v4
              with:
                  version: latest

            - name: Install Helm
              uses: azure/setup-helm@v4
              with:
                  version: latest

            - name: Update kubeconfig
              run: |
                  aws eks update-kubeconfig \
                    --name "${{ steps.cfn.outputs.cluster }}" \
                    --region "$AWS_REGION"

            - name: Install / upgrade External Secrets Operator
              env:
                  ESO_ROLE: ${{ steps.cfn.outputs.eso-role }}
                  ESO_VERSION: ${{ inputs.eso_version || env.ESO_VERSION_DEFAULT }}
              run: |
                  set -euo pipefail
                  helm repo add external-secrets https://charts.external-secrets.io
                  helm repo update
                  helm upgrade --install external-secrets external-secrets/external-secrets \
                    --namespace external-secrets --create-namespace \
                    --version "$ESO_VERSION" \
                    --set installCRDs=true \
                    --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="$ESO_ROLE" \
                    --wait --timeout 5m

            - name: Install / upgrade AWS Gateway API Controller
              env:
                  GWAPI_ROLE: ${{ steps.cfn.outputs.gwapi-role }}
                  LATTICE_NET: ${{ steps.cfn.outputs.lattice-net }}
                  CLUSTER_NAME: ${{ steps.cfn.outputs.cluster }}
                  CLUSTER_VPC_ID: ${{ steps.cfn.outputs.vpc-id }}
                  AWS_ACCOUNT_ID: ${{ steps.cfn.outputs.account-id }}
                  GWAPI_VERSION: ${{ inputs.gwapi_version || env.GWAPI_VERSION_DEFAULT }}
              run: |
                  set -euo pipefail
                  # The controller needs the upstream Gateway API CRDs installed
                  # in-cluster. Use server-side apply so the field manager is
                  # consistent with Helm (which also uses SSA). --force-conflicts
                  # lets us take ownership of fields previously managed by an
                  # earlier client-side `kubectl apply` if any exist.
                  kubectl apply --server-side --force-conflicts -f \
                    https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.1.0/standard-install.yaml

                  # Helm chart is published to a public ECR; no `helm repo add` needed.
                  # --skip-crds: chart bundles older Gateway API CRDs (v0.6.1) that
                  # would conflict with the v1.1.0 set we just applied.
                  # awsRegion / clusterVpcId / clusterName / awsAccountId are
                  # required: the chart maps them to the controller's REGION,
                  # CLUSTER_VPC_ID, CLUSTER_NAME, AWS_ACCOUNT_ID env vars and
                  # the controller crash-loops on startup if any are empty.
                  helm upgrade --install gateway-api-controller \
                    oci://public.ecr.aws/aws-application-networking-k8s/aws-gateway-controller-chart \
                    --version "$GWAPI_VERSION" \
                    --namespace aws-application-networking-system --create-namespace \
                    --skip-crds \
                    --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="$GWAPI_ROLE" \
                    --set defaultServiceNetwork="$LATTICE_NET" \
                    --set awsRegion="$AWS_REGION" \
                    --set clusterVpcId="$CLUSTER_VPC_ID" \
                    --set clusterName="$CLUSTER_NAME" \
                    --set awsAccountId="$AWS_ACCOUNT_ID" \
                    --set log.level=info \
                    --wait --timeout 5m

            - name: Diagnostics — Gateway API Controller
              if: always()
              run: |
                  echo "==== nodes ===="
                  kubectl get nodes -o wide || true
                  echo "==== ns ===="
                  kubectl -n aws-application-networking-system get all || true
                  echo "==== pods (wide) ===="
                  kubectl -n aws-application-networking-system get pods -o wide || true
                  echo "==== describe pods ===="
                  kubectl -n aws-application-networking-system describe pods || true
                  echo "==== describe deploy ===="
                  kubectl -n aws-application-networking-system describe deploy || true
                  echo "==== events ===="
                  kubectl -n aws-application-networking-system get events --sort-by=.lastTimestamp || true
                  echo "==== logs (any container, both prev and current) ===="
                  for p in $(kubectl -n aws-application-networking-system get pods -o name 2>/dev/null); do
                    echo "---- $p ----"
                    kubectl -n aws-application-networking-system logs "$p" --all-containers --tail=200 || true
                    kubectl -n aws-application-networking-system logs "$p" --all-containers --previous --tail=100 2>/dev/null || true
                  done

            - name: Verify controllers are running
              run: |
                  echo "---- ESO ----"
                  kubectl -n external-secrets get pods
                  kubectl -n external-secrets rollout status deployment/external-secrets --timeout=2m
                  kubectl -n external-secrets rollout status deployment/external-secrets-webhook --timeout=2m
                  kubectl -n external-secrets rollout status deployment/external-secrets-cert-controller --timeout=2m

                  echo "---- Gateway API Controller ----"
                  kubectl -n aws-application-networking-system get pods
                  kubectl -n aws-application-networking-system rollout status \
                    deployment/gateway-api-controller-aws-gateway-controller-chart --timeout=3m

                  echo "---- GatewayClass ----"
                  kubectl get gatewayclass amazon-vpc-lattice -o wide || true
