name: Deploy

# Build images and deploy to the env mapped from the branch (or chosen via
# workflow_dispatch input):
#   develop      -> dev   (auto)
#   test         -> test  (manual approval via Environment)
#   main/master  -> prod  (manual approval via Environment)
#
# Approval gates come from GitHub Environments (Settings -> Environments).

on:
    # push:
    #     branches: [ main, master, test, develop ]
    workflow_dispatch:
        inputs:
            environment:
                description: Target environment to deploy to
                required: true
                type: choice
                options: [ dev, test, prod ]
                

env:
    AWS_REGION: us-east-1
    PROJECT_NAME: transact
    RESOURCE_SUFFIX: "01"

concurrency:
    group: cd-${{ github.ref }}
    cancel-in-progress: false # never cancel an in-flight deploy

jobs:
    # ---- 1. Build (resolve env + build & push Docker images) ----------------
    build:
        name: Build & push images
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # OIDC -> AWS
        env:
            AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        outputs:
            target-env: ${{ steps.resolve.outputs.env }}
            image-tag: ${{ steps.meta.outputs.tag }}
            api-image: ${{ steps.meta.outputs.api_image }}
            web-image: ${{ steps.meta.outputs.web_image }}
        steps:
            - uses: actions/checkout@v4

            - name: Resolve target environment
              id: resolve
              run: |
                  if [ -n "${{ inputs.environment }}" ]; then
                    echo "env=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
                  else
                    case "${GITHUB_REF_NAME}" in
                      develop)        echo "env=dev"  >> "$GITHUB_OUTPUT" ;;
                      test)           echo "env=test" >> "$GITHUB_OUTPUT" ;;
                      main|master)    echo "env=prod" >> "$GITHUB_OUTPUT" ;;
                      *)              echo "::error::Branch ${GITHUB_REF_NAME} is not mapped to an environment." ; exit 1 ;;
                    esac
                  fi

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Compute image tag
              id: meta
              env:
                  TARGET_ENV: ${{ steps.resolve.outputs.env }}
              run: |
                  SHA="${GITHUB_SHA::12}"
                  TAG="${TARGET_ENV}-${SHA}"
                  REPO="${PROJECT_NAME}-${TARGET_ENV}-${AWS_REGION}-ecr-${RESOURCE_SUFFIX}"
                  echo "tag=$TAG"                              >> "$GITHUB_OUTPUT"
                  echo "repo=$REPO"                            >> "$GITHUB_OUTPUT"
                  echo "api_image=${REPO}:api-$TAG"            >> "$GITHUB_OUTPUT"
                  echo "web_image=${REPO}:web-$TAG"            >> "$GITHUB_OUTPUT"

            - name: Configure AWS credentials
              if: env.AWS_ROLE_TO_ASSUME != ''
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              if: env.AWS_ROLE_TO_ASSUME != ''
              id: ecr-login
              uses: aws-actions/amazon-ecr-login@v2

            - name: Resolve registry prefix
              id: registry
              run: |
                  if [ -n "${{ steps.ecr-login.outputs.registry }}" ]; then
                    echo "prefix=${{ steps.ecr-login.outputs.registry }}/" >> "$GITHUB_OUTPUT"
                    echo "push=true"  >> "$GITHUB_OUTPUT"
                  else
                    echo "prefix="    >> "$GITHUB_OUTPUT"
                    echo "push=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::AWS_ROLE_TO_ASSUME secret not set — building images without pushing."
                  fi

            - name: Build & (optionally) push API image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Transact.Api/Dockerfile
                  push: ${{ steps.registry.outputs.push }}
                  tags: |
                      ${{ steps.registry.outputs.prefix }}${{ steps.meta.outputs.repo }}:api-${{ steps.meta.outputs.tag }}
                      ${{ steps.registry.outputs.prefix }}${{ steps.meta.outputs.repo }}:api-${{ steps.resolve.outputs.env }}-latest
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,scope=api,mode=max
                  provenance: false

            - name: Build & (optionally) push Web image
              uses: docker/build-push-action@v6
              with:
                  context: Transact.Web
                  file: Transact.Web/Dockerfile
                  push: ${{ steps.registry.outputs.push }}
                  tags: |
                      ${{ steps.registry.outputs.prefix }}${{ steps.meta.outputs.repo }}:web-${{ steps.meta.outputs.tag }}
                      ${{ steps.registry.outputs.prefix }}${{ steps.meta.outputs.repo }}:web-${{ steps.resolve.outputs.env }}-latest
                  cache-from: type=gha,scope=web
                  cache-to: type=gha,scope=web,mode=max
                  provenance: false

    # ---- 2. Deploy (single job, environment chosen dynamically) -------------
    # Approval gates: configure required reviewers on the `test` and `prod`
    # GitHub Environments under Settings -> Environments. `dev` deploys auto.
    deploy:
        name: Deploy · ${{ needs.build.outputs.target-env }}
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: ${{ needs.build.outputs.target-env }}
        steps:
            - name: Show images being deployed
              run: |
                  echo "Env      : ${{ needs.build.outputs.target-env }}"
                  echo "API image: ${{ needs.build.outputs.api-image }}"
                  echo "Web image: ${{ needs.build.outputs.web-image }}"
                  echo "Tag      : ${{ needs.build.outputs.image-tag }}"
            - name: Deploy
              run: echo "TODO — invoke ${{ needs.build.outputs.target-env }} deploy here (e.g.
                  aws ecs update-service ...)"
