name: Deploy

# Build images and deploy to the env mapped from the branch (or chosen via
# workflow_dispatch input):


on:
    workflow_dispatch:
        inputs:
            environment:
                description: Target environment to deploy to
                required: true
                type: choice
                options: [ dev, test, prod ]
            aws_region:
                description: AWS region to deploy to (must match the region of the EKS cluster)
                required: false
                default: "us-east-1"
              
env:
    AWS_REGION: ${{ inputs.aws_region || 'us-east-1' }}
    PROJECT_NAME: transact
    RESOURCE_SUFFIX: "01"

concurrency:
    group: cd-${{ github.ref }}
    cancel-in-progress: false # never cancel an in-flight deploy

jobs:
    # ---- 1. Build (resolve env + build & push Docker images) ----------------
    build:
        name: Build & push images
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # OIDC -> AWS
        env:
            AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        outputs:
            target-env: ${{ steps.resolve.outputs.env }}
            image-tag: ${{ steps.meta.outputs.tag }}
            api-image: ${{ steps.images.outputs.api }}
            web-image: ${{ steps.images.outputs.web }}
        steps:
            - uses: actions/checkout@v4

            - name: Resolve target environment
              id: resolve
              run: |
                  if [ -n "${{ inputs.environment }}" ]; then
                    echo "env=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
                  else
                    case "${GITHUB_REF_NAME}" in
                      develop)        echo "env=dev"  >> "$GITHUB_OUTPUT" ;;
                      test)           echo "env=test" >> "$GITHUB_OUTPUT" ;;
                      main|master)    echo "env=prod" >> "$GITHUB_OUTPUT" ;;
                      *)              echo "::error::Branch ${GITHUB_REF_NAME} is not mapped to an environment." ; exit 1 ;;
                    esac
                  fi

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Compute image tag
              id: meta
              env:
                  TARGET_ENV: ${{ steps.resolve.outputs.env }}
              run: |
                  SHA="${GITHUB_SHA::12}"
                  TAG="${TARGET_ENV}-${SHA}"
                  REPO="${PROJECT_NAME}-${TARGET_ENV}-${AWS_REGION}-ecr-${RESOURCE_SUFFIX}"
                  echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
                  echo "repo=$REPO" >> "$GITHUB_OUTPUT"

            - name: Configure AWS credentials
              if: env.AWS_ROLE_TO_ASSUME != ''
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              if: env.AWS_ROLE_TO_ASSUME != ''
              id: ecr-login
              uses: aws-actions/amazon-ecr-login@v2

            - name: Resolve registry prefix
              id: registry
              run: |
                  if [ -n "${{ steps.ecr-login.outputs.registry }}" ]; then
                    echo "prefix=${{ steps.ecr-login.outputs.registry }}/" >> "$GITHUB_OUTPUT"
                    echo "push=true"  >> "$GITHUB_OUTPUT"
                  else
                    echo "prefix="    >> "$GITHUB_OUTPUT"
                    echo "push=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::AWS_ROLE_TO_ASSUME secret not set — building images without pushing."
                  fi

            - name: Compose full image URIs
              id: images
              env:
                  PREFIX: ${{ steps.registry.outputs.prefix }}
                  REPO: ${{ steps.meta.outputs.repo }}
                  TAG: ${{ steps.meta.outputs.tag }}
              run: |
                  echo "api=${PREFIX}${REPO}:api-${TAG}" >> "$GITHUB_OUTPUT"
                  echo "web=${PREFIX}${REPO}:web-${TAG}" >> "$GITHUB_OUTPUT"

            - name: Build & (optionally) push API image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Transact.Api/Dockerfile
                  push: ${{ steps.registry.outputs.push }}
                  tags: |
                      ${{ steps.registry.outputs.prefix }}${{ steps.meta.outputs.repo }}:api-${{ steps.meta.outputs.tag }}
                      ${{ steps.registry.outputs.prefix }}${{ steps.meta.outputs.repo }}:api-${{ steps.resolve.outputs.env }}-latest
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,scope=api,mode=max
                  provenance: false

            - name: Build & (optionally) push Web image
              uses: docker/build-push-action@v6
              with:
                  context: Transact.Web
                  file: Transact.Web/Dockerfile
                  push: ${{ steps.registry.outputs.push }}
                  tags: |
                      ${{ steps.registry.outputs.prefix }}${{ steps.meta.outputs.repo }}:web-${{ steps.meta.outputs.tag }}
                      ${{ steps.registry.outputs.prefix }}${{ steps.meta.outputs.repo }}:web-${{ steps.resolve.outputs.env }}-latest
                  cache-from: type=gha,scope=web
                  cache-to: type=gha,scope=web,mode=max
                  provenance: false

    # ---- 2. Deploy (single job, environment chosen dynamically) -------------
    # Approval gates: configure required reviewers on the `test` and `prod`
    # GitHub Environments under Settings -> Environments. `dev` deploys auto.
    deploy:
        name: Deploy · ${{ needs.build.outputs.target-env }}
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: ${{ needs.build.outputs.target-env }}
        permissions:
            contents: read
            id-token: write # OIDC -> AWS
        env:
            TARGET_ENV: ${{ needs.build.outputs.target-env }}
            API_IMAGE: ${{ needs.build.outputs.api-image }}
            WEB_IMAGE: ${{ needs.build.outputs.web-image }}
            # Workflow-level env (PROJECT_NAME, AWS_REGION, RESOURCE_SUFFIX)
            # is not visible in job-level env expressions, so the stack name
            # is composed in a step below instead of here.
        steps:
            - uses: actions/checkout@v4

            - name: Show images being deployed
              run: |
                  echo "Env      : ${TARGET_ENV}"
                  echo "API image: ${API_IMAGE}"
                  echo "Web image: ${WEB_IMAGE}"
                  echo "Tag      : ${{ needs.build.outputs.image-tag }}"

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Resolve EKS cluster + DB endpoint from CFN outputs
              id: cfn
              run: |
                  set -euo pipefail
                  STACK_NAME="${PROJECT_NAME}-${TARGET_ENV}-${AWS_REGION}-core-${RESOURCE_SUFFIX}"
                  echo "stack=$STACK_NAME" >> "$GITHUB_OUTPUT"
                  echo "Resolving outputs from CloudFormation stack: $STACK_NAME"

                  CLUSTER=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
                    --query "Stacks[0].Outputs[?OutputKey=='EksClusterName'].OutputValue" --output text)
                  DB_HOST=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
                    --query "Stacks[0].Outputs[?OutputKey=='DbEndpointAddress'].OutputValue" --output text)
                  if [ -z "$CLUSTER" ] || [ "$CLUSTER" = "None" ]; then
                    echo "::error::EksClusterName output not found on stack $STACK_NAME" ; exit 1
                  fi
                  echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"
                  echo "db-host=$DB_HOST" >> "$GITHUB_OUTPUT"

            - name: Install kubectl
              uses: azure/setup-kubectl@v4
              with:
                  version: latest

            - name: Update kubeconfig
              run: |
                  aws eks update-kubeconfig \
                    --name "${{ steps.cfn.outputs.cluster }}" \
                    --region "$AWS_REGION"

            - name: Render manifests (sed image tags + DB host)
              run: |
                  set -euo pipefail
                  mkdir -p .deploy
                  # Copy manifests then substitute placeholders. Using sed
                  # keeps things dependency-free; switch to kustomize/helm
                  # for richer per-env templating later.
                  cp -r k8s .deploy/k8s

                  # Image tags from this build.
                  sed -i "s|REPLACE_ME_API_IMAGE|${API_IMAGE}|g" .deploy/k8s/api/deployment.yaml
                  sed -i "s|REPLACE_ME_WEB_IMAGE|${WEB_IMAGE}|g" .deploy/k8s/web/deployment.yaml

                  # Per-env Secrets Manager key (db-secret name follows the
                  # project naming convention). host/port/dbname now come
                  # from the secret itself, so no DB host substitution.
                  SECRET_KEY="${PROJECT_NAME}-${TARGET_ENV}-${AWS_REGION}-rds-creds-${RESOURCE_SUFFIX}"
                  sed -i "s|transact-dev-us-east-1-rds-creds-01|${SECRET_KEY}|g" \
                    .deploy/k8s/api/external-secret.yaml

                  echo "---- rendered api/deployment.yaml ----"
                  grep -E '^\s*image:' .deploy/k8s/api/deployment.yaml
                  echo "---- rendered web/deployment.yaml ----"
                  grep -E '^\s*image:' .deploy/k8s/web/deployment.yaml
                  echo "---- rendered external-secret.yaml ----"
                  grep -E '^\s*key:' .deploy/k8s/api/external-secret.yaml



            - name: Apply manifests
              run: |
                  set -euo pipefail
                  kubectl apply -f .deploy/k8s/namespace.yaml
                  kubectl apply -f .deploy/k8s/api/cluster-secret-store.yaml
                  kubectl apply -f .deploy/k8s/api/configmap.yaml
                  kubectl apply -f .deploy/k8s/api/external-secret.yaml
                  kubectl apply -f .deploy/k8s/api/service.yaml
                  kubectl apply -f .deploy/k8s/web/service.yaml
                  kubectl apply -f .deploy/k8s/api/deployment.yaml
                  kubectl apply -f .deploy/k8s/web/deployment.yaml
                  kubectl apply -f .deploy/k8s/gateway/gateway.yaml

            - name: Wait for rollout
              run: |
                  kubectl -n transact rollout status deployment/transact-api --timeout=5m
                  kubectl -n transact rollout status deployment/transact-web --timeout=5m
