name: CD

# Build & push images, then deploy to the env mapped from the branch:
#   develop      -> dev   (auto)
#   test         -> test  (manual approval via Environment)
#   main/master  -> prod  (manual approval via Environment)
#
# Approval gates are configured under Settings → Environments. The lint/test
# checks are re-run here so a CD run is self-contained and re-runnable.

on:
    push:
        branches: [ main, master, test, develop ]
    workflow_dispatch:

env:
    DOTNET_VERSION: "10.0.x"
    NODE_VERSION: "22"
    AWS_REGION: us-east-1
    ECR_REPOSITORY_API: transact-api
    ECR_REPOSITORY_WEB: transact-web

concurrency:
    group: cd-${{ github.ref }}
    cancel-in-progress: false # never cancel an in-flight deploy

jobs:
    # ---- Re-run lint/test as a gate before producing images ------------------
    backend-test:
        name: Backend · build & test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}
            - uses: actions/cache@v4
              with:
                  path: ~/.nuget/packages
                  key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
                  restore-keys: nuget-${{ runner.os }}-
            - run: dotnet restore Transact.slnx
            - run: dotnet build Transact.slnx --configuration Release --no-restore
            - shell: bash
              run: |
                  shopt -s nullglob
                  tests=(**/*Tests.csproj **/*.Test.csproj)
                  if [ ${#tests[@]} -eq 0 ]; then
                    echo "No test projects found — skipping."
                  else
                    dotnet test Transact.slnx --configuration Release --no-build
                  fi

    frontend-test:
        name: Frontend · lint, test & build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: Transact.Web
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: Transact.Web/package-lock.json
            - run: npm ci
            - run: npm run build -- --configuration production

    # ---- Map branch -> environment ------------------------------------------
    resolve-env:
        name: Resolve target environment
        runs-on: ubuntu-latest
        outputs:
            env: ${{ steps.map.outputs.env }}
        steps:
            - id: map
              run: |
                  case "${GITHUB_REF_NAME}" in
                    develop)        echo "env=dev"  >> "$GITHUB_OUTPUT" ;;
                    test)           echo "env=test" >> "$GITHUB_OUTPUT" ;;
                    main|master)    echo "env=prod" >> "$GITHUB_OUTPUT" ;;
                    *)              echo "env="     >> "$GITHUB_OUTPUT" ;;
                  esac

    # ---- Build (and optionally push) Docker images --------------------------
    docker:
        name: Docker · build & push
        needs: [ backend-test, frontend-test, resolve-env ]
        if: needs.resolve-env.outputs.env != ''
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # OIDC -> AWS
        env:
            AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
            TARGET_ENV: ${{ needs.resolve-env.outputs.env }}
        outputs:
            image-tag: ${{ steps.meta.outputs.tag }}
            api-image: ${{ steps.meta.outputs.api_image }}
            web-image: ${{ steps.meta.outputs.web_image }}
            target-env: ${{ needs.resolve-env.outputs.env }}
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Compute image tag
              id: meta
              run: |
                  SHA="${GITHUB_SHA::12}"
                  TAG="${TARGET_ENV}-${SHA}"
                  echo "tag=$TAG"                                       >> "$GITHUB_OUTPUT"
                  echo "api_image=${{ env.ECR_REPOSITORY_API }}:$TAG"   >> "$GITHUB_OUTPUT"
                  echo "web_image=${{ env.ECR_REPOSITORY_WEB }}:$TAG"   >> "$GITHUB_OUTPUT"

            - name: Configure AWS credentials
              if: env.AWS_ROLE_TO_ASSUME != ''
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              if: env.AWS_ROLE_TO_ASSUME != ''
              id: ecr-login
              uses: aws-actions/amazon-ecr-login@v2

            - name: Resolve registry prefix
              id: registry
              run: |
                  if [ -n "${{ steps.ecr-login.outputs.registry }}" ]; then
                    echo "prefix=${{ steps.ecr-login.outputs.registry }}/" >> "$GITHUB_OUTPUT"
                    echo "push=true"  >> "$GITHUB_OUTPUT"
                  else
                    echo "prefix="    >> "$GITHUB_OUTPUT"
                    echo "push=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::AWS_ROLE_TO_ASSUME secret not set — building images without pushing."
                  fi

            - name: Build & (optionally) push API image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Transact.Api/Dockerfile
                  push: ${{ steps.registry.outputs.push }}
                  tags: |
                      ${{ steps.registry.outputs.prefix }}${{ env.ECR_REPOSITORY_API }}:${{ steps.meta.outputs.tag }}
                      ${{ steps.registry.outputs.prefix }}${{ env.ECR_REPOSITORY_API }}:${{ env.TARGET_ENV }}-latest
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,scope=api,mode=max
                  provenance: false

            - name: Build & (optionally) push Web image
              uses: docker/build-push-action@v6
              with:
                  context: Transact.Web
                  file: Transact.Web/Dockerfile
                  push: ${{ steps.registry.outputs.push }}
                  tags: |
                      ${{ steps.registry.outputs.prefix }}${{ env.ECR_REPOSITORY_WEB }}:${{ steps.meta.outputs.tag }}
                      ${{ steps.registry.outputs.prefix }}${{ env.ECR_REPOSITORY_WEB }}:${{ env.TARGET_ENV }}-latest
                  cache-from: type=gha,scope=web
                  cache-to: type=gha,scope=web,mode=max
                  provenance: false

    # ---- Per-environment deploys (approval gates via GitHub Environments) ---
    deploy-dev:
        name: Deploy · dev (auto)
        needs: docker
        if: needs.docker.outputs.target-env == 'dev'
        runs-on: ubuntu-latest
        environment:
            name: dev
            url: https://dev.transact.example.com
        steps:
            - name: Show images being deployed
              run: |
                  echo "Env      : ${{ needs.docker.outputs.target-env }}"
                  echo "API image: ${{ needs.docker.outputs.api-image }}"
                  echo "Web image: ${{ needs.docker.outputs.web-image }}"
                  echo "Tag      : ${{ needs.docker.outputs.image-tag }}"
            - name: Deploy
              run: echo "TODO — invoke dev deploy here (e.g. aws ecs update-service ...)"

    deploy-test:
        name: Deploy · test (manual approval)
        needs: docker
        if: needs.docker.outputs.target-env == 'test'
        runs-on: ubuntu-latest
        environment:
            name: test
            url: https://test.transact.example.com
        steps:
            - name: Show images being deployed
              run: |
                  echo "Env      : ${{ needs.docker.outputs.target-env }}"
                  echo "API image: ${{ needs.docker.outputs.api-image }}"
                  echo "Web image: ${{ needs.docker.outputs.web-image }}"
                  echo "Tag      : ${{ needs.docker.outputs.image-tag }}"
            - name: Deploy
              run: echo "TODO — invoke test deploy here"

    deploy-prod:
        name: Deploy · prod (manual approval)
        needs: docker
        if: needs.docker.outputs.target-env == 'prod'
        runs-on: ubuntu-latest
        environment:
            name: prod
            url: https://transact.example.com
        steps:
            - name: Show images being deployed
              run: |
                  echo "Env      : ${{ needs.docker.outputs.target-env }}"
                  echo "API image: ${{ needs.docker.outputs.api-image }}"
                  echo "Web image: ${{ needs.docker.outputs.web-image }}"
                  echo "Tag      : ${{ needs.docker.outputs.image-tag }}"
            - name: Deploy
              run: echo "TODO — invoke prod deploy here"
