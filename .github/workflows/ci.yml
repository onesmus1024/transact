name: Lint & Test

# Lint + test only. Triggered by pull requests targeting the release
# branches (develop, test, main/master). Pushes are NOT covered here —
# CD handles release-branch pushes; feature branches are validated via
# their PRs.

on:
    pull_request:
        branches: [ main, master, test, develop ]
    push:
        branches: [ main, master, test, develop ]
        paths-ignore:
            - '**/*.md'
    workflow_dispatch:

env:
    DOTNET_VERSION: "10.0.x"
    NODE_VERSION: "22"

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint (backend + frontend)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Cache NuGet packages
              uses: actions/cache@v4
              with:
                  path: ~/.nuget/packages
                  key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
                  restore-keys: nuget-${{ runner.os }}-

            - name: Restore (.NET)
              run: dotnet restore Transact.slnx

            - name: Lint .NET (format check)
              run: dotnet format Transact.slnx --verify-no-changes --verbosity diagnostic

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: Transact.Web/package-lock.json

            - name: Install (npm)
              working-directory: Transact.Web
              run: npm ci

            - name: Lint Angular
              working-directory: Transact.Web
              shell: bash
              run: |
                  if npm run | grep -qE '^\s*lint'; then
                    npm run lint
                  else
                    echo "No lint script — skipping."
                  fi

    test:
        name: Test (backend + frontend)
        needs: lint # fail-fast: skip tests if lint fails
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Cache NuGet packages
              uses: actions/cache@v4
              with:
                  path: ~/.nuget/packages
                  key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
                  restore-keys: nuget-${{ runner.os }}-

            - name: Restore (.NET)
              run: dotnet restore Transact.slnx

            - name: Build (.NET)
              run: dotnet build Transact.slnx --configuration Release --no-restore

            - name: Test .NET
              shell: bash
              run: |
                  shopt -s nullglob
                  tests=(**/*Tests.csproj **/*.Test.csproj)
                  if [ ${#tests[@]} -eq 0 ]; then
                    echo "No test projects found — skipping."
                  else
                    dotnet test Transact.slnx --configuration Release --no-build \
                      --logger "trx;LogFileName=test-results.trx" \
                      --collect:"XPlat Code Coverage"
                  fi

            - name: Upload .NET test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: backend-test-results
                  path: "**/TestResults/**"
                  if-no-files-found: ignore

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: Transact.Web/package-lock.json

            - name: Install (npm)
              working-directory: Transact.Web
              run: npm ci

            - name: Test Angular
              working-directory: Transact.Web
              shell: bash
              run: |
                  if npm run | grep -qE '^\s*test'; then
                    CI=true npm test -- --watch=false --browsers=ChromeHeadless
                  else
                    echo "No test script — skipping."
                  fi
