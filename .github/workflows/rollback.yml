name: Rollback

# Manual rollback. Re-deploys an existing image tag to the chosen environment.
# Approval is enforced by the GitHub Environment (`dev` / `test` / `prod`).
#
# Usage:
#   1. Actions -> Rollback -> Run workflow
#   2. Pick the environment.
#   3. Optionally pin a specific image tag (e.g. `prod-1a2b3c4d5e6f`).
#      If left blank, the workflow picks the immediately previous successful
#      build for that environment from this workflow's history.

on:
    workflow_dispatch:
        inputs:
            environment:
                description: Environment to roll back
                required: true
                type: choice
                options: [ dev, test, prod ]
            image_tag:
                description: Image tag to redeploy (e.g. `prod-1a2b3c4d5e6f`). Leave blank to
                    use the previous successful build.
                required: false
                type: string
                default: ""
            reason:
                description: Why are you rolling back? (audit trail)
                required: true
                type: string

env:
    AWS_REGION: us-east-1
    ECR_REPOSITORY_API: transact-api
    ECR_REPOSITORY_WEB: transact-web

concurrency:
    # Serialize rollbacks per environment so two operators can't race.
    group: rollback-${{ inputs.environment }}
    cancel-in-progress: false

jobs:
    # ---------------------------------------------------------------------------
    # Resolve which image tag to redeploy.
    # If the operator supplied one, use it. Otherwise look up the previous
    # successful run of the CI/CD workflow that pushed an image for this env
    # and reuse that tag.
    # ---------------------------------------------------------------------------
    resolve-tag:
        name: Resolve previous image tag
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
        outputs:
            image_tag: ${{ steps.pick.outputs.image_tag }}
            api_image: ${{ steps.pick.outputs.api_image }}
            web_image: ${{ steps.pick.outputs.web_image }}
        steps:
            - name: Pick tag
              id: pick
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TARGET_ENV: ${{ inputs.environment }}
                  REQUESTED_TAG: ${{ inputs.image_tag }}
              run: |
                  set -euo pipefail

                  if [ -n "${REQUESTED_TAG}" ]; then
                    TAG="${REQUESTED_TAG}"
                    echo "Using operator-supplied tag: $TAG"
                  else
                    echo "Looking up previous successful build for env=$TARGET_ENV..."
                    # Find the most recent successful run of ci-cd.yml whose
                    # docker job produced a tag for this environment, skipping
                    # the very latest one (that's the bad deploy we're undoing).
                    RUNS=$(gh run list \
                      --workflow ci-cd.yml \
                      --status success \
                      --limit 25 \
                      --json databaseId,headSha,headBranch \
                      --jq '.[] | select(.headBranch == (
                              if env.TARGET_ENV == "dev"  then "develop"
                              elif env.TARGET_ENV == "test" then "test"
                              else "main" end
                            )) | .headSha')

                    # Skip the first (current) one and take the next.
                    PREV_SHA=$(echo "$RUNS" | sed -n '2p')
                    if [ -z "$PREV_SHA" ]; then
                      # main may also be released from `master` — try once more.
                      if [ "$TARGET_ENV" = "prod" ]; then
                        RUNS=$(gh run list \
                          --workflow ci-cd.yml --status success --limit 25 \
                          --json headSha,headBranch \
                          --jq '.[] | select(.headBranch == "master") | .headSha')
                        PREV_SHA=$(echo "$RUNS" | sed -n '2p')
                      fi
                    fi

                    if [ -z "$PREV_SHA" ]; then
                      echo "::error::Could not find a previous successful build for env=$TARGET_ENV. Pass image_tag explicitly."
                      exit 1
                    fi

                    TAG="${TARGET_ENV}-${PREV_SHA:0:12}"
                    echo "Resolved previous tag: $TAG"
                  fi

                  echo "image_tag=$TAG"                                         >> "$GITHUB_OUTPUT"
                  echo "api_image=${{ env.ECR_REPOSITORY_API }}:$TAG"           >> "$GITHUB_OUTPUT"
                  echo "web_image=${{ env.ECR_REPOSITORY_WEB }}:$TAG"           >> "$GITHUB_OUTPUT"

    # ---------------------------------------------------------------------------
    # Verify the chosen tag actually exists in ECR before we redeploy.
    # ---------------------------------------------------------------------------
    verify:
        name: Verify image exists in ECR
        needs: resolve-tag
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        env:
            AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
            IMAGE_TAG: ${{ needs.resolve-tag.outputs.image_tag }}
        steps:
            - name: Configure AWS credentials
              if: env.AWS_ROLE_TO_ASSUME != ''
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Describe images
              if: env.AWS_ROLE_TO_ASSUME != ''
              run: |
                  set -euo pipefail
                  for repo in "${{ env.ECR_REPOSITORY_API }}" "${{ env.ECR_REPOSITORY_WEB }}"; do
                    echo "Checking $repo:$IMAGE_TAG ..."
                    aws ecr describe-images \
                      --repository-name "$repo" \
                      --image-ids imageTag="$IMAGE_TAG" >/dev/null
                  done
                  echo "Both images present."

            - name: Skip notice (no AWS creds configured)
              if: env.AWS_ROLE_TO_ASSUME == ''
              run: echo "::notice::AWS_ROLE_TO_ASSUME not set — skipping ECR existence check."

    # ---------------------------------------------------------------------------
    # Manual approval gate + actual rollback. The `environment:` binding makes
    # GitHub block the job until the configured reviewers approve.
    # ---------------------------------------------------------------------------
    rollback:
        name: Rollback ${{ inputs.environment }}
        needs: [ resolve-tag, verify ]
        runs-on: ubuntu-latest
        environment:
            name: ${{ inputs.environment }}
        steps:
            - name: Summary
              run: |
                  echo "### Rollback summary"           >> "$GITHUB_STEP_SUMMARY"
                  echo ""                               >> "$GITHUB_STEP_SUMMARY"
                  echo "| Field | Value |"              >> "$GITHUB_STEP_SUMMARY"
                  echo "|---|---|"                      >> "$GITHUB_STEP_SUMMARY"
                  echo "| Environment | \`${{ inputs.environment }}\` |"          >> "$GITHUB_STEP_SUMMARY"
                  echo "| Image tag   | \`${{ needs.resolve-tag.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| Triggered by | @${{ github.actor }} |"                  >> "$GITHUB_STEP_SUMMARY"
                  echo "| Reason | ${{ inputs.reason }} |"                        >> "$GITHUB_STEP_SUMMARY"

            - name: Show what will be deployed
              run: |
                  echo "API image: ${{ needs.resolve-tag.outputs.api_image }}"
                  echo "Web image: ${{ needs.resolve-tag.outputs.web_image }}"

            # Replace with your real deploy step (ECS update-service, kubectl set
            # image, helm upgrade --set image.tag=..., etc.). Keep the command
            # idempotent so re-running the rollback is safe.
            - name: Deploy previous image
              run: |
                  echo "TODO — invoke deploy here, e.g.:"
                  echo "aws ecs update-service \\"
                  echo "  --cluster transact-${{ inputs.environment }} \\"
                  echo "  --service transact-api \\"
                  echo "  --force-new-deployment \\"
                  echo "  --task-definition transact-api:${{ needs.resolve-tag.outputs.image_tag }}"

            - name: Re-tag rolled-back image as <env>-latest
              if: env.AWS_ROLE_TO_ASSUME != ''
              env:
                  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  IMAGE_TAG: ${{ needs.resolve-tag.outputs.image_tag }}
              run: |
                  echo "TODO — optionally retag $IMAGE_TAG -> ${{ inputs.environment }}-latest in ECR"
                  echo "so any consumers of the floating tag also see the rolled-back build."
