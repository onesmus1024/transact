# Container is run as a non-root user (uid 101 in nginx:alpine) with a
# read-only root filesystem on Kubernetes, so:
#   - listen on 8080 (binding <1024 needs root)
#   - keep PID + temp files under writable emptyDir mounts
#
# Note: when run via docker-compose alongside the API service, the upstream
# `api:8080` resolves via Docker DNS. In Kubernetes the Web pod calls the
# API through the Lattice gateway / Service, not via this nginx proxy, so
# the /api/ proxy block below is only used in local compose dev.
upstream transact_api {
    server api:8080;
}

server {
    listen       8080;
    server_name  _;

    # Security-ish defaults.
    server_tokens off;
    client_max_body_size 1m;

    root   /usr/share/nginx/html;
    index  index.html;

    # Reverse-proxy: /api/<path>  ->  http://api:8080/<path>  (compose dev only)
    location /api/ {
        proxy_pass         http://transact_api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Long-cache hashed Angular assets.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — let the Angular router handle deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
