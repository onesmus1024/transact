# Container is run as a non-root user (uid 101 in nginx:alpine) with a
# read-only root filesystem on Kubernetes, so:
#   - listen on 8080 (binding <1024 needs root)
#   - keep PID + temp files under writable emptyDir mounts
#
# In Kubernetes the Web pod calls the API through the Lattice gateway, so
# the /api/ proxy block below is primarily for local compose dev. We
# resolve the upstream LAZILY via a variable + resolver so nginx doesn't
# crash at startup when the API service isn't reachable (e.g. in the
# cluster where the Service is named `transact-api` and lives in this
# namespace, or in compose where it's `api`).

server {
    listen       8080;
    server_name  _;

    # Security-ish defaults.
    server_tokens off;
    client_max_body_size 1m;

    root   /usr/share/nginx/html;
    index  index.html;

    # Reverse-proxy: /api/<path>  ->  http://transact-api:8080/<path>
    # Using an `upstream` block forces nginx to resolve the host at
    # startup; switching to a literal proxy_pass with a variable would
    # need a `resolver` IP. Instead, we keep startup fast by relying on
    # /etc/resolv.conf search domains: the K8s Service is `transact-api`
    # in the `transact` namespace, and the docker-compose service is
    # aliased to the same name (see docker-compose.yml).
    location /api/ {
        proxy_pass         http://transact-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Long-cache hashed Angular assets.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — let the Angular router handle deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
