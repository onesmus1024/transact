# Top-level nginx config tuned for non-root + read-only-root-filesystem
# operation. The default /etc/nginx/nginx.conf in the upstream image
# writes pid + temp paths under /var/run and /var/cache/nginx (root-owned
# and not writable when readOnlyRootFilesystem=true). We override paths
# to land in directories the deployment mounts as emptyDir.
worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Move all temp paths off the read-only root.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /dev/stdout main;

    include /etc/nginx/conf.d/*.conf;
}
