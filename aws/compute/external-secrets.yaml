AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Transact - External Secrets Operator (ESO) IRSA role nested stack.
  Creates the IAM role assumed by the ESO ServiceAccount via OIDC. The
  controller is installed in-cluster (Helm) and references this role via
  the eks.amazonaws.com/role-arn annotation on its ServiceAccount.
  Permissions are scoped to the project's Secrets Manager secrets only.

Parameters:
  ProjectName:
    Type: String
  EnvironmentName:
    Type: String
    AllowedValues: [ dev, test, prod ]
  RegionCode:
    Type: String
  ResourceSuffix:
    Type: String

  OidcProviderArn:
    Type: String
    AllowedPattern: '^arn:aws[a-zA-Z-]*:iam::\d{12}:oidc-provider/.+$'

  OidcIssuerUrl:
    Type: String

  ControllerNamespace:
    Type: String
    Default: external-secrets

  ControllerServiceAccount:
    Type: String
    Default: external-secrets

Resources:
  EsoRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-eso-role-${ResourceSuffix}'
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": { "Federated": "${OidcProviderArn}" },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "${IssuerHost}:aud": "sts.amazonaws.com",
                      "${IssuerHost}:sub": "system:serviceaccount:${Namespace}:${ServiceAccount}"
                    }
                  }
                }
              ]
            }
          - IssuerHost: !Select [ 1, !Split [ 'https://', !Ref OidcIssuerUrl ] ]
            OidcProviderArn: !Ref OidcProviderArn
            Namespace: !Ref ControllerNamespace
            ServiceAccount: !Ref ControllerServiceAccount
      Policies:
        - PolicyName: eso-secrets-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                  - secretsmanager:ListSecretVersionIds
                Resource:
                  # Scope to project secrets only.
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}-${EnvironmentName}-${RegionCode}-*'
              - Effect: Allow
                Action: secretsmanager:ListSecrets
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-eso-role-${ResourceSuffix}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  EsoRoleArn:
    Description: IRSA role ARN for the ESO ServiceAccount.
    Value: !GetAtt EsoRole.Arn

  ControllerNamespace:
    Value: !Ref ControllerNamespace

  ControllerServiceAccount:
    Value: !Ref ControllerServiceAccount
