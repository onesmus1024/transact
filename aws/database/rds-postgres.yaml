AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Transact - PostgreSQL RDS nested stack. Provisions a single RDS for
  PostgreSQL instance in the private subnets of the VPC stack, with the
  master password stored in AWS Secrets Manager. A security group permits
  inbound traffic on the DB port from sources inside the VPC CIDR.

Parameters:
  ProjectName:
    Type: String
  EnvironmentName:
    Type: String
    AllowedValues: [ dev, test, prod ]
  RegionCode:
    Type: String
  ResourceSuffix:
    Type: String

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC in which to place the DB instance.

  DbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >
      Security group for the DB instance. Provisioned in the networking
      stack so it can be shared with app/compute stacks without creating
      a circular dependency.

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets (>=2 AZs) for the DB subnet group.

  DbName:
    Type: String
    Default: transact
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]{0,62}$'
    Description: Initial database name created on the instance.

  DbMasterUsername:
    Type: String
    Default: transact_admin
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]{0,62}$'
    NoEcho: true

  DbInstanceClass:
    Type: String
    Default: auto
    Description: >
      RDS instance class. Use 'auto' to pick a sensible default based on
      EnvironmentName via the EnvDefaults mapping:
        dev  -> db.t4g.micro   (1 vCPU,  1 GiB) - cheapest, burstable
        test -> db.t4g.small   (2 vCPU,  2 GiB) - small but headroom for CI
        prod -> db.m7g.large   (2 vCPU,  8 GiB) - steady perf, Graviton
      Override with any valid RDS class (e.g. db.r7g.large) if needed.

  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1024
    Description: Allocated storage in GiB.

  DbMaxAllocatedStorage:
    Type: Number
    Default: 100
    MinValue: 20
    MaxValue: 4096
    Description: Storage autoscaling upper bound in GiB.

  EngineVersion:
    Type: String
    Default: '16.4'
    Description: PostgreSQL engine version.

  MultiAz:
    Type: String
    Default: 'false'
    AllowedValues: [ 'true', 'false' ]
    Description: Enable Multi-AZ standby. Recommended for prod.

  BackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 0
    MaxValue: 35

  DeletionProtection:
    Type: String
    Default: 'false'
    AllowedValues: [ 'true', 'false' ]

Conditions:
  IsProd: !Equals [ !Ref EnvironmentName, 'prod' ]
  UseAutoInstanceClass: !Equals [ !Ref DbInstanceClass, 'auto' ]

Mappings:
  EnvDefaults:
    dev:
      InstanceClass: db.t4g.micro
    test:
      InstanceClass: db.t4g.small
    prod:
      InstanceClass: db.m7g.large

Resources:
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub 'Subnet group for ${ProjectName}-${EnvironmentName} PostgreSQL'
      SubnetIds: !Ref PrivateSubnetIds
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-rds-subnetgrp-${ResourceSuffix}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  DbMasterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/${EnvironmentName}/${RegionCode}/rds/postgres/${ResourceSuffix}'
      Description: !Sub 'Master credentials for ${ProjectName}-${EnvironmentName} PostgreSQL'
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DbMasterUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\$`'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-rds-secret-${ResourceSuffix}'

  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-pg-${ResourceSuffix}'
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !If
        - UseAutoInstanceClass
        - !FindInMap [ EnvDefaults, !Ref EnvironmentName, InstanceClass ]
        - !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      MaxAllocatedStorage: !Ref DbMaxAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DbName
      MasterUsername: !Sub '{{resolve:secretsmanager:${DbMasterSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbMasterSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroupId
      PubliclyAccessible: false
      MultiAZ: !Ref MultiAz
      BackupRetentionPeriod: !Ref BackupRetentionDays
      PreferredBackupWindow: '03:00-04:00'
      PreferredMaintenanceWindow: 'sun:04:30-sun:05:30'
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      DeletionProtection: !Ref DeletionProtection
      EnablePerformanceInsights: !If [ IsProd, true, false ]
      PerformanceInsightsRetentionPeriod: !If [ IsProd, 7, !Ref AWS::NoValue ]
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-pg-${ResourceSuffix}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  DbSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DbMasterSecret
      TargetId: !Ref DbInstance
      TargetType: AWS::RDS::DBInstance

Outputs:
  DbInstanceId:
    Description: RDS instance identifier.
    Value: !Ref DbInstance

  DbEndpointAddress:
    Description: RDS endpoint hostname.
    Value: !GetAtt DbInstance.Endpoint.Address

  DbEndpointPort:
    Description: RDS endpoint port.
    Value: !GetAtt DbInstance.Endpoint.Port

  DbName:
    Description: Initial database name.
    Value: !Ref DbName

  DbMasterSecretArn:
    Description: ARN of the Secrets Manager secret holding master credentials.
    Value: !Ref DbMasterSecret
