AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Transact - VPC Lattice service network nested stack. Creates a Lattice
  service network and associates the VPC with it. The network is the
  routing fabric used by the AWS Gateway API Controller (running in EKS)
  to back Kubernetes Gateway / HTTPRoute resources with Lattice services.

Parameters:
  ProjectName:
    Type: String
  EnvironmentName:
    Type: String
    AllowedValues: [ dev, test, prod ]
  RegionCode:
    Type: String
  ResourceSuffix:
    Type: String

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to associate with the service network.

  AuthType:
    Type: String
    Default: NONE
    AllowedValues: [ NONE, AWS_IAM ]
    Description: >
      Authentication mode for the service network. AWS_IAM enforces SigV4
      on every request via Lattice auth policies. Use NONE for dev unless
      you've configured per-route auth.

Resources:
  ServiceNetwork:
    Type: AWS::VpcLattice::ServiceNetwork
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-lattice-${ResourceSuffix}'
      AuthType: !Ref AuthType
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-lattice-${ResourceSuffix}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  VpcAssociation:
    Type: AWS::VpcLattice::ServiceNetworkVpcAssociation
    Properties:
      ServiceNetworkIdentifier: !Ref ServiceNetwork
      VpcIdentifier: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-lattice-vpcassoc-${ResourceSuffix}'

Outputs:
  ServiceNetworkId:
    Description: VPC Lattice service network ID.
    Value: !Ref ServiceNetwork

  ServiceNetworkArn:
    Description: VPC Lattice service network ARN.
    Value: !GetAtt ServiceNetwork.Arn

  ServiceNetworkName:
    Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-lattice-${ResourceSuffix}'
