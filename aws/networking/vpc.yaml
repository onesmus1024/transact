AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Transact - VPC nested stack. Creates a VPC with two public + two private
  subnets across two AZs and an Internet Gateway. NAT egress is configurable:
    - CreateNatGateway=false  -> no NAT (private subnets have no egress)
    - CreateNatGateway=true,  MultiAzNat=false -> single NAT in AZ-a (cheaper)
    - CreateNatGateway=true,  MultiAzNat=true  -> one NAT per AZ (HA)

Parameters:
  ProjectName:
    Type: String
  EnvironmentName:
    Type: String
  RegionCode:
    Type: String
  ResourceSuffix:
    Type: String
  VpcCidr:
    Type: String
  PublicSubnet1Cidr:
    Type: String
  PublicSubnet2Cidr:
    Type: String
  PrivateSubnet1Cidr:
    Type: String
  PrivateSubnet2Cidr:
    Type: String
  CreateNatGateway:
    Type: String
    AllowedValues: [ 'true', 'false' ]
    Default: 'true'
  MultiAzNat:
    Type: String
    AllowedValues: [ 'true', 'false' ]
    Default: 'true'
    Description: >
      When 'true' (and CreateNatGateway is 'true'), provision one NAT gateway
      per AZ so loss of an AZ does not break egress for the other private
      subnet. Costs ~$32/mo per extra NAT.

Conditions:
  WithNat: !Equals [ !Ref CreateNatGateway, 'true' ]
  WithMultiAzNat: !And
    - !Equals [ !Ref CreateNatGateway, 'true' ]
    - !Equals [ !Ref MultiAzNat, 'true' ]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-vpc-${ResourceSuffix}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-igw-${ResourceSuffix}'

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-subnet-pub1-${ResourceSuffix}'
        - Key: Tier
          Value: public

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-subnet-pub2-${ResourceSuffix}'
        - Key: Tier
          Value: public

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-subnet-prv1-${ResourceSuffix}'
        - Key: Tier
          Value: private

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-subnet-prv2-${ResourceSuffix}'
        - Key: Tier
          Value: private

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-rtb-pub-${ResourceSuffix}'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  NatEip1:
    Type: AWS::EC2::EIP
    Condition: WithNat
    DependsOn: AttachInternetGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-eip-nat1-${ResourceSuffix}'

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Condition: WithNat
    Properties:
      AllocationId: !GetAtt NatEip1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-nat1-${ResourceSuffix}'

  NatEip2:
    Type: AWS::EC2::EIP
    Condition: WithMultiAzNat
    DependsOn: AttachInternetGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-eip-nat2-${ResourceSuffix}'

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Condition: WithMultiAzNat
    Properties:
      AllocationId: !GetAtt NatEip2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-nat2-${ResourceSuffix}'

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-rtb-prv1-${ResourceSuffix}'

  PrivateDefaultRoute1:
    Type: AWS::EC2::Route
    Condition: WithNat
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      SubnetId: !Ref PrivateSubnet1

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-rtb-prv2-${ResourceSuffix}'

  # When MultiAzNat=true, route via NatGateway2 (in AZ-b). Otherwise share NAT1.
  PrivateDefaultRoute2:
    Type: AWS::EC2::Route
    Condition: WithNat
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [ WithMultiAzNat, !Ref NatGateway2, !Ref NatGateway1 ]

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      SubnetId: !Ref PrivateSubnet2

Outputs:
  VpcId:
    Value: !Ref Vpc
  VpcCidr:
    Value: !GetAtt Vpc.CidrBlock
  PublicSubnetIds:
    Value: !Join [ ',', [ !Ref PublicSubnet1, !Ref PublicSubnet2 ] ]
  PrivateSubnetIds:
    Value: !Join [ ',', [ !Ref PrivateSubnet1, !Ref PrivateSubnet2 ] ]
  PublicRouteTableId:
    Value: !Ref PublicRouteTable
  PrivateRouteTableIds:
    Value: !Join [ ',', [ !Ref PrivateRouteTable1, !Ref PrivateRouteTable2 ] ]
  AvailabilityZones:
    Value: !Join [ ',', [ !GetAtt PrivateSubnet1.AvailabilityZone, !GetAtt PrivateSubnet2.AvailabilityZone ] ]
