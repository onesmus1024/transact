AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Transact - ECR nested stack. Creates private ECR repositories for the API
  and Web container images with image scanning, AES256 encryption, and a
  lifecycle policy that retains the most recent N images per environment tag.

Parameters:
  ProjectName:
    Type: String
  EnvironmentName:
    Type: String
  RegionCode:
    Type: String
    Default: use1
  ResourceSuffix:
    Type: String
    Default: '01'
  ApiRepositoryName:
    Type: String
    Default: transact-api
  WebRepositoryName:
    Type: String
    Default: transact-web
  ImageRetentionCount:
    Type: Number
    Default: 20
    MinValue: 1
    Description: Number of most recent env-tagged images to keep before expiring.

Resources:
  ApiRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref ApiRepositoryName
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last ${ImageRetentionCount} ${EnvironmentName}-tagged images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["${EnvironmentName}-"],
                  "countType": "imageCountMoreThan",
                  "countNumber": ${ImageRetentionCount}
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Expire untagged images after 7 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-ecr-api-${ResourceSuffix}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  WebRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref WebRepositoryName
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last ${ImageRetentionCount} ${EnvironmentName}-tagged images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["${EnvironmentName}-"],
                  "countType": "imageCountMoreThan",
                  "countNumber": ${ImageRetentionCount}
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Expire untagged images after 7 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-ecr-web-${ResourceSuffix}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  ApiRepositoryName:
    Value: !Ref ApiRepository
  ApiRepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
  ApiRepositoryArn:
    Value: !GetAtt ApiRepository.Arn
  WebRepositoryName:
    Value: !Ref WebRepository
  WebRepositoryUri:
    Value: !GetAtt WebRepository.RepositoryUri
  WebRepositoryArn:
    Value: !GetAtt WebRepository.Arn
