AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Transact - Database Secrets nested stack. Owns the AWS Secrets Manager
  secret holding the PostgreSQL master credentials. Lives outside the RDS
  stack so the secret can be created (and rotated/managed) independently of
  the database lifecycle, and so other stacks (app/compute, migration jobs)
  can grant access to it without depending on the RDS stack.

Parameters:
  ProjectName:
    Type: String
  EnvironmentName:
    Type: String
    AllowedValues: [ dev, test, prod ]
  RegionCode:
    Type: String
  ResourceSuffix:
    Type: String

  DbMasterUsername:
    Type: String
    Default: transact_admin
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]{0,62}$'
    NoEcho: true
    Description: Username embedded into the generated secret payload.

  PasswordLength:
    Type: Number
    Default: 32
    MinValue: 16
    MaxValue: 128

Resources:
  DbMasterSecret:
    Type: AWS::SecretsManager::Secret
    # Retain so accidental stack deletion does not nuke production credentials.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-rds-secret-${ResourceSuffix}'
      Description: !Sub 'Master credentials for ${ProjectName}-${EnvironmentName} PostgreSQL'
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DbMasterUsername}"}'
        GenerateStringKey: password
        PasswordLength: !Ref PasswordLength
        # Exclude characters that are awkward in connection strings or that
        # PostgreSQL/RDS reject in master passwords (/, @, ", space).
        ExcludeCharacters: '"@/\ '
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-rds-secret-${ResourceSuffix}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  DbMasterSecretArn:
    Description: ARN of the Secrets Manager secret holding master credentials.
    Value: !Ref DbMasterSecret

  DbMasterSecretName:
    Description: Friendly name of the secret.
    Value: !Sub '${ProjectName}-${EnvironmentName}-${RegionCode}-rds-secret-${ResourceSuffix}'
