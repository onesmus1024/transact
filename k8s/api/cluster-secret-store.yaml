# Cluster-wide SecretStore that talks to AWS Secrets Manager via the IRSA
# role created in aws/compute/external-secrets.yaml. The ServiceAccount
# `external-secrets` in namespace `external-secrets` (created by the ESO
# Helm install) must be annotated with the role ARN.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      # Override per-cluster via kustomize/helm if you deploy to multiple
      # regions. Default to us-east-1.
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
