# NOTE: Image tag is templated at deploy time. Replace ${IMAGE_TAG} with the
# CI build identifier (or use kustomize/helm). The repo URI comes from the
# ECR stack output `ApiRepositoryUri`.
#
# Example:
#   sed "s|REPLACE_ME_API_IMAGE|<acct>.dkr.ecr.us-east-1.amazonaws.com/transact:api-${SHA}|g" \
#     k8s/api/deployment.yaml | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transact-api
  namespace: transact
  labels:
    app.kubernetes.io/name: transact-api
    app.kubernetes.io/part-of: transact
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: transact-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transact-api
        app.kubernetes.io/part-of: transact
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654   # matches the built-in `app` user in mcr.microsoft.com/dotnet/aspnet:10.0
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: REPLACE_ME_API_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: transact-api-config
                  key: aspnetcoreEnvironment
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: transact-db-connection
                  key: connectionString
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: transact-api
