# Pulls the full RDS connection details from Secrets Manager and renders
# a Kubernetes Secret containing the Npgsql connection string the API
# reads via ConnectionStrings__DefaultConnection.
#
# Source secret: created by aws/secrets/db-secret.yaml + RDS managed-secret
#   key:  transact-dev-us-east-1-rds-creds-01
#   json: { "username", "password", "host", "port", "dbname", "engine",
#           "dbInstanceIdentifier" }
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: transact-db-connection
  namespace: transact
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: transact-db-connection
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        connectionString: >-
          Host={{ .host }};Port={{ .port }};Database={{ .dbname }};Username={{ .username }};Password={{ .password }};SSL Mode=Require;Trust Server Certificate=true
  data:
    - secretKey: username
      remoteRef:
        key: transact-dev-us-east-1-rds-creds-01
        property: username
    - secretKey: password
      remoteRef:
        key: transact-dev-us-east-1-rds-creds-01
        property: password
    - secretKey: host
      remoteRef:
        key: transact-dev-us-east-1-rds-creds-01
        property: host
    - secretKey: port
      remoteRef:
        key: transact-dev-us-east-1-rds-creds-01
        property: port
    - secretKey: dbname
      remoteRef:
        key: transact-dev-us-east-1-rds-creds-01
        property: dbname
