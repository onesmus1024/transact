# Pulls the RDS master credentials from Secrets Manager and renders a
# Kubernetes Secret containing the full Npgsql connection string the API
# reads via ConnectionStrings__DefaultConnection.
#
# Source secret: created by aws/secrets/db-secret.yaml
#   key:  transact-dev-us-east-1-rds-secret-01
#   json: { "username": "...", "password": "..." }
#
# RDS host/port/dbname are NOT stored in Secrets Manager (they're stack
# outputs). They're held in the `transact-db-endpoint` ConfigMap and
# pulled into the template via templateFrom.
apiVersion: v1
kind: ConfigMap
metadata:
  name: transact-db-endpoint
  namespace: transact
data:
  # Set at deploy time (sed/kustomize/helm) from CFN root-stack outputs:
  #   DbEndpointAddress, DbEndpointPort, DbName
  dbHost: REPLACE_ME_DB_HOST
  dbPort: "5432"
  dbName: transact
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: transact-db-connection
  namespace: transact
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: transact-db-connection
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      # templateFrom pulls host/port/db keys from the ConfigMap into the
      # template scope so they can be referenced as {{ .dbHost }} etc.
      templateFrom:
        - configMap:
            name: transact-db-endpoint
            items:
              - key: dbHost
              - key: dbPort
              - key: dbName
      data:
        connectionString: >-
          Host={{ .dbHost }};Port={{ .dbPort }};Database={{ .dbName }};Username={{ .username }};Password={{ .password }};SSL Mode=Require;Trust Server Certificate=true
  data:
    - secretKey: username
      remoteRef:
        key: transact-dev-us-east-1-rds-secret-01
        property: username
    - secretKey: password
      remoteRef:
        key: transact-dev-us-east-1-rds-secret-01
        property: password
