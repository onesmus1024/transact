# GatewayClass implemented by the AWS Load Balancer Controller.
# Each Gateway with gatewayClassName: alb provisions an internet-facing
# (or internal) ALB. Requires the controller installed by bootstrap.yml.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: alb
spec:
  controllerName: gateway.k8s.aws/alb
