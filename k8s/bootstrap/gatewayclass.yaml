# Cluster-scoped GatewayClass for AWS VPC Lattice. Applied by the
# bootstrap workflow alongside the AWS Gateway API Controller install,
# so it is created once per cluster (not per app deploy).
#
# `controllerName` is what the AWS Gateway API Controller watches; do
# not change it.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: amazon-vpc-lattice
spec:
  controllerName: application-networking.k8s.aws/gateway-api-controller
