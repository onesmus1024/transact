# Public ALB Gateway provisioned by the AWS Load Balancer Controller.
# The controller creates an internet-facing ALB; point a CNAME from
# transact.ryansofttechnologies.com (Namecheap) at the ALB DNS name
# emitted in `kubectl get gateway transact -o yaml` (.status.addresses).
#
# Once an ACM certificate for transact.ryansofttechnologies.com exists,
# uncomment the HTTPS listener block below and put the cert ARN in the
# listener TLS options.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: transact
  namespace: transact
  annotations:
    # Public ALB. Use 'internal' for VPC-only.
    alb.gateway.networking.k8s.aws/scheme: internet-facing
    # Register pods directly (vs node-port). Required when target pods
    # use the AWS VPC CNI (default on EKS).
    alb.gateway.networking.k8s.aws/target-type: ip
    # When the HTTPS listener is enabled below, force redirect.
    # alb.gateway.networking.k8s.aws/ssl-redirect: '443'
spec:
  # Gateway API support in AWS LBC is gated behind
  # controllerConfig.featureGates.ALBGatewayAPI=true (set by
  # .github/workflows/bootstrap.yml). Requires LBC chart >=1.13.0.
  gatewayClassName: alb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: transact.ryansofttechnologies.com
      allowedRoutes:
        namespaces:
          from: Same
    # --- Enable once ACM cert is issued -------------------------------
    # - name: https
    #   protocol: HTTPS
    #   port: 443
    #   hostname: transact.ryansofttechnologies.com
    #   tls:
    #     mode: Terminate
    #     options:
    #       alb.gateway.networking.k8s.aws/certificate-arns: arn:aws:acm:us-east-1:633564234239:certificate/REPLACE_ME
    #   allowedRoutes:
    #     namespaces:
    #       from: Same
---
# /api/* -> API service (strip /api prefix to match upstream paths).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: transact-api
  namespace: transact
spec:
  parentRefs:
    - name: transact
      sectionName: http
  hostnames:
    - transact.ryansofttechnologies.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: transact-api
          port: 80
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /swagger
        - path:
            type: PathPrefix
            value: /health
      backendRefs:
        - name: transact-api
          port: 80
          weight: 1
---
# Everything else -> web (Angular SPA).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: transact-web
  namespace: transact
spec:
  parentRefs:
    - name: transact
      sectionName: http
  hostnames:
    - transact.ryansofttechnologies.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: transact-web
          port: 80
          weight: 1
